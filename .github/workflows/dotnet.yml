name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 🧪 JOB 1: Rápido, sem infra, roda em paralelo ou primeiro
  testes-rapidos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore & Build
      run: |
        dotnet restore
        dotnet build --no-restore
    - name: Executar Testes Unitários
      run: dotnet test Teste.Unitario/Teste.Unitario.csproj --no-build --verbosity normal

  # 🔐 JOB 2: Pesado, precisa do MySQL e só roda se os testes rápidos passarem!
  testes-complexos:
    runs-on: ubuntu-latest
    needs: testes-rapidos # 🎯 O PULO DO GATO: Se o unitário quebrar, nem gasta tempo ligando o MySQL aqui!
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: SistemaMatricula_Testes_DB
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore & Build
      run: |
        dotnet restore
        dotnet build --no-restore
    - name: Wait for MySQL
      run: sleep 20s

    # Roda a integração com o banco pronto
    - name: Executar Testes de Integração
      env:
        ASPNETCORE_ENVIRONMENT: "Testing"
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=SistemaMatricula_Testes_DB;Uid=root;Pwd=rootpassword;"
      run: dotnet test Teste.Integraçao/Teste.Integraçao.csproj --no-build --verbosity normal

    # Roda as permissões com o banco pronto
    - name: Executar Testes de Autorização e Permissão
      env:
        ASPNETCORE_ENVIRONMENT: "Testing"
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=SistemaMatricula_Testes_DB;Uid=root;Pwd=rootpassword;"
      run: dotnet test Teste.Autorizaçao.Permicao/Teste.Autorizaçao.Permicao.csproj --no-build --verbosity normal